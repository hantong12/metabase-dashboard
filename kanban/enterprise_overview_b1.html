nt\": \"金梅:客服02\",\n  \"volume\": 4712,\n  \"overall5m\": 21.23,\n  \"conversion\": 5.05,\n  \"overallAvgResponse\": 13375,\n  \"reception5m\": 20.85,\n  \"resp1m\": 7.5\n }\n];\n\nlet chartInstances=[];\nfunction destroyAll(){chartInstances.forEach(c=>{try{c.destroy()}catch(e){}});chartInstances=[]}\n\nfunction getRadarData(a){\nreturn{\nlabels:['5分钟响应率','转化率','平均响应时间','接待量','5分钟被接待率','1分钟响应率'],\nvalues:[\n{value:a.overall5m,unit:'%'},\n{value:a.conversion,unit:'%'},\n{value:(a.overallAvgResponse/60).toFixed(0),unit:'min'},\n{value:a.volume,unit:''},\n{value:a.reception5m,unit:'%'},\n{value:a.resp1m,unit:'%'}\n],\nnormalized:[\nMath.min(100,Math.max(0,(a.overall5m-10)*1.1)),\na.conversion*5,\nMath.max(0,100-a.overallAvgResponse/120),\nMath.min(100,a.volume/200),\nMath.min(100,Math.max(0,(a.reception5m-10)*1.1)),\nMath.min(100,Math.max(0,(a.resp1m-5)*1.1))\n]};\n}\n\nfunction generateRadar(){\nvar grid=document.getElementById('agentRadarGrid');\ngrid.innerHTML='';\nvar colors=['#667eea','#52c41a','#1890ff','#faad14','#13c2c2','#eb2f96','#722ed1'];\nagentData.forEach(function(a,i){\nvar card=document.createElement('div');\ncard.className='radar-card';\nvar id='ar-'+i;\ncard.innerHTML='<h4>'+a.name+'<\/h4><canvas id=\"'+id+'\" height=\"240\"><\/canvas>';\ngrid.appendChild(card);\n});\nsetTimeout(function(){\nagentData.forEach(function(a,i){\nvar id='ar-'+i;\nvar canvas=document.getElementById(id);\nif(!canvas)return;\nvar ctx=canvas.getContext('2d');\nvar norm=[\nMath.min(100,Math.max(0,(a.overall5m-10)*1.1)),\na.conversion*5,\nMath.max(0,100-a.overallAvgResponse/120),\nMath.min(100,a.volume/200),\nMath.min(100,Math.max(0,(a.reception5m-10)*1.1)),\nMath.min(100,Math.max(0,(a.resp1m-5)*1.1))\n];\nnew Chart(ctx,{\ntype:'radar',\ndata:{\nlabels:['5分钟响应率','转化率','平均响应时间','接待量','5分钟被接待率','1分钟响应率'],\ndatasets:[{data:norm,backgroundColor:colors[i]+'33',borderColor:colors[i],borderWidth:2,pointBackgroundColor:colors[i],pointRadius:3}]\n},\noptions:{responsive:true,scales:{r:{beginAtZero:true,max:100,ticks:{display:false},grid:{color:'#e8e8e8'},pointLabels:{font:{size:10}}}},plugins:{legend:{display:false}}}\n});\n});\n},200);\nvar s1=document.getElementById('selectAgent1');\nvar s2=document.getElementById('selectAgent2');\ns1.innerHTML='<option value=\"\">选择客服账号1<\/option>';\ns2.innerHTML='<option value=\"\">选择客服账号2<\/option>';\nagentData.forEach(function(a,i){s1.innerHTML+='<option value=\"'+i+'\">'+a.name+'<\/option>';s2.innerHTML+='<option value=\"'+i+'\">'+a.name+'<\/option>'});\n}\n\nlet cmpChart=null;\nfunction compareAgents(){\nvar i1=document.getElementById('selectAgent1').value;\nvar i2=document.getElementById('selectAgent2').value;\nif(i1===''||i2===''||i1===i2){alert('请选择两个不同的客服账号');return}\nvar a1=agentData[i1],a2=agentData[i2];\nvar d1=getRadarData(a1),d2=getRadarData(a2);\nif(cmpChart){cmpChart.destroy();cmpChart=null}\nvar canvas=document.getElementById('agentComparisonRadar');\ncmpChart=new Chart(canvas.getContext('2d'),{\ntype:'radar',\ndata:{labels:d1.labels,datasets:[\n{label:a1.name,data:d1.normalized,backgroundColor:'#667eea33',borderColor:'#667eea',borderWidth:2,pointBackgroundColor:'#667eea'},\n{label:a2.name,data:d2.normalized,backgroundColor:'#ff4d4f33',borderColor:'#ff4d4f',borderWidth:2,pointBackgroundColor:'#ff4d4f'}\n]},\noptions:{responsive:true,scales:{r:{beginAtZero:true,max:100,ticks:{display:false},grid:{color:'#e8e8e8'},pointLabels:{font:{size:11}}}},plugins:{legend:{display:false}}}\n});\ndocument.getElementById('agent1Legend').textContent=a1.name;\ndocument.getElementById('agent2Legend').textContent=a2.name;\ndocument.getElementById('agentComparisonResult').style.display='block';\nvar h='<table class=\"diff-table\"><thead><tr><th>指标<\/th><th>'+a1.name+'<\/th><th>'+a2.name+'<\/th><th>差异<\/th><\/tr><\/thead><tbody>';\nd1.labels.forEach(function(l,j){\nvar v1=d1.values[j],v2=d2.values[j];\nvar diff=v2.value-v1.value;\nvar dt=v1.unit===''?(diff>0?'+':'')+diff.toLocaleString():(diff>0?'+':'')+diff.toFixed(2)+v1.unit;\nh+='<tr><td>'+l+'<\/td><td>'+v1.value+v1.unit+'<\/td><td>'+v2.value+v2.unit+'<\/td><td>'+dt+'<\/td><\/tr>';\n});\nh+='<\/tbody><\/table>';\ndocument.getElementById('agentComparisonDiff').innerHTML=h;\n}\n\ngenerateRadar();\n<\/script>\n<\/body>\n<\/html>\n"];
