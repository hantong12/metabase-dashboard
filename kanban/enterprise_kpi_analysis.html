<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>企业版客户 KPI 分析 · 2026年6-9月</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
     background:#f5f6fa;color:#1f2937;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(120deg,#2F5597,#4a7bc8);color:#fff;padding:20px 26px}
header h1{font-size:19px;font-weight:700;letter-spacing:.3px}
header p{font-size:12.5px;margin-top:6px;color:#d6e2f7}
.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e5e8ef;padding:10px 26px;
     display:flex;align-items:center;gap:18px;flex-wrap:wrap;box-shadow:0 1px 6px rgba(24,39,75,.05)}
.tabs{display:flex;gap:4px;background:#f1f3f8;border-radius:9px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:7px;font-size:13px;color:#4b5563;cursor:pointer;font-family:inherit;transition:.15s}
.tabs button:hover{color:#2F5597}
.tabs button.on{background:#2F5597;color:#fff;font-weight:600;box-shadow:0 1px 4px rgba(47,85,151,.3)}
.ctrls{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ctrls label{font-size:12px;color:#6b7280;display:flex;align-items:center;gap:6px}
.ctrls select{font-family:inherit;font-size:12.5px;padding:6px 10px;border:1px solid #d7dce6;border-radius:7px;background:#fff;color:#1f2937;cursor:pointer;outline:none}
.ctrls select:focus{border-color:#2F5597;box-shadow:0 0 0 2px rgba(47,85,151,.12)}
main{padding:18px 26px 40px;max-width:1560px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:#fff;border-radius:11px;padding:15px 17px;border-left:4px solid var(--c);box-shadow:0 1px 5px rgba(24,39,75,.06)}
.kh{font-size:12px;color:#6b7280;font-weight:600}
.kv{font-size:27px;font-weight:700;color:var(--c);margin:5px 0 3px;letter-spacing:-.4px}
.ks{font-size:11px;color:#9aa3b2}
.kt{margin-top:10px;padding-top:9px;border-top:1px dashed #e8ebf2;display:flex;gap:12px;flex-wrap:wrap}
.tp{font-size:11.5px;color:#374151}
.tp b{color:#9aa3b2;font-weight:500;margin-right:4px;font-size:10.5px}
.kf{margin-top:7px;font-size:11px;color:#9aa3b2}
.card{background:#fff;border-radius:11px;padding:16px 18px;box-shadow:0 1px 5px rgba(24,39,75,.06);margin-bottom:16px}
.ct{font-size:13px;font-weight:700;color:#1f2937;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.ct:before{content:'';width:3px;height:13px;background:#2F5597;border-radius:2px}
.cw{position:relative;height:360px}
.tw{overflow:auto;max-height:640px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f4f6fa;color:#4b5563;font-weight:600;padding:8px 9px;text-align:center;border-bottom:1.5px solid #e2e6ef;
   position:sticky;top:0;white-space:nowrap;font-size:11.5px;z-index:2}
td{padding:7px 9px;text-align:center;border-bottom:1px solid #f0f2f7;white-space:nowrap}
tbody tr:hover{background:#f8fafd}
td.rh{text-align:left;font-weight:600;color:#2F5597}
td.hl{background:#f6f8fc;font-weight:600}
tr.warn td{background:#fffaf0}
tr.warn:hover td{background:#fff5e3}
.sub{font-size:10px;color:#9aa3b2}
footer{text-align:center;font-size:11.5px;color:#9aa3b2;padding:0 20px 30px}
</style></head>
<body>
<header>
  <h1>企业版客户 KPI 分析</h1>
  <p>577 家企业版客户 · 2026年6-9月 · 行业 / 站点 / 平台对比 · 总体·机器人·人工分层 · 简单平均 / 中位数 / 加权平均</p>
</header>
<div class="bar">
  <div class="tabs" id="tabs">
    <button data-tab="industry" class="on">行业趋势</button>
    <button data-tab="site">按站点</button>
    <button data-tab="plat">按平台</button>
  </div>
  <div class="ctrls">
    <label>指标 <select id="metric"></select></label>
    <label id="layerWrap">层级 <select id="layer">
      <option value="all">总体</option><option value="bot">机器人</option><option value="human">人工</option>
    </select></label>
    <label>口径 <select id="stat">
      <option value="mean">简单平均</option><option value="median">中位数</option><option value="wavg">加权平均</option>
    </select></label>
  </div>
</div>
<main>
  <div class="kpis" id="kpis"></div>
  <div class="card"><div class="ct" id="chartTitle"></div><div class="cw" id="chartWrap"><canvas id="chart"></canvas></div></div>
  <div class="card"><div class="ct" id="tblTitle"></div><div class="tw"><table id="tbl"></table></div></div>
  <div id="metricHint" style="display:none"></div>
</main>
<footer>数据来源：乐聊 Metabase 客户健康指标（dashboard 177 · KPI 卡 1626） · 有效样本 = 该层接待量>0 的客户；简单平均=客户等权｜中位数=客户中位｜加权平均=Σ下单/Σ接待</footer>

var STAT_CN = { mean:'简单平均', median:'中位数', wavg:'加权平均' };

function fmtDur(sec){
  if (sec == null) return '—';
  var s = Math.round(sec), h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  if (h > 0) return h + '小时' + m + '分';
  if (m > 0) return m + '分' + ss + '秒';
  return ss + '秒';
}
function fmt(v, kind){
  if (v == null || !isFinite(v)) return '—';
  if (kind === 'pct') return (v*100).toFixed(2) + '%';
  if (kind === 'int') return Math.round(v).toLocaleString('en-US');
  if (kind === 'money') return '¥' + Math.round(v).toLocaleString('en-US');
  if (kind === 'dur') return fmtDur(v);
  return String(v);
}
function cell(v, kind){ return fmt(v, kind); }

var state = { tab:'industry', family:'cvr', layer:'all', stat:'mean' };

function getFam(){ return FAMILIES.filter(function(f){ return f.id === state.family; })[0]; }
function getGroup(key){ return AGG.groups[key]; }
function pick(groupKey, field, stat){
  var g = getGroup(groupKey);
  if (!g) return null;
  var st = g.metrics[field];
  if (!st) return null;
  return st[stat] == null ? null : st[stat];
}

/* ---------- KPI 卡 ---------- */
function renderKpis(){
  var fam = getFam();
  var layers = Object.keys(fam.ids);
  var html = '';
  for (var i = 0; i < layers.length; i++){
    var L = layers[i], field = fam.ids[L];
    var vLast = pick('ALL|' + LAST, field, state.stat);
    var vA = pick('ALL|ALL', field, state.stat);
    var nLast = (getGroup('ALL|' + LAST) || {metrics:{}}).metrics[field];
    var trend = '';
    for (var j = 0; j < TREND_MONTHS.length; j++){
      var mk = TREND_MONTHS[j];
      var vv = pick('ALL|' + mk, field, state.stat);
      trend += '<span class="tp"><b>' + MLABEL[mk] + '</b>' + fmt(vv, fam.kind) + '</span>';
    }
    html += '<div class="kpi" style="--c:' + LAYER_COLOR[L] + '">' +
      '<div class="kh">全行业 · ' + LAYER_CN[L] + '</div>' +
      '<div class="kv">' + fmt(vLast, fam.kind) + '</div>' +
      '<div class="ks">' + MLABEL[LAST] + ' · ' + STAT_CN[state.stat] + (nLast && nLast.n != null ? ' · n=' + nLast.n : '') + '</div>' +
      '<div class="kt">' + trend + '</div>' +
      '<div class="kf">' + MLABEL['ALL'] + ' ' + fmt(vA, fam.kind) + '</div>' +
      '</div>';
  }
  document.getElementById('kpis').innerHTML = html;
}

  for (i = 0; i < layers.length; i++) for (j = 0; j < MONTHS.length; j++){
    var st = (getGroup('ALL|' + MONTHS[j]) || {metrics:{}}).metrics[fam.ids[layers[i]]] || {};
    h += '<td>' + fmt(st[state.stat], fam.kind) + '<br><span class="sub">n=' + (st.n == null ? '—' : st.n) + '</span></td>';
  }
  h += '</tr></tbody>';
  document.getElementById('tbl').innerHTML = h;
  document.getElementById('tblTitle').textContent = fam.name + ' · 全行业明细';
}

/* ---------- 站点 / 平台 ---------- */
function renderDim(prefix){
  var fam = getFam();
  var useLayer = fam.ids[state.layer] ? state.layer : Object.keys(fam.ids)[0];
  var field = fam.ids[useLayer];
  var keys = Object.keys(AGG.groups).filter(function(k){ return k.indexOf(prefix) === 0 && /[|]ALL$/.test(k); });
  var rows = keys.map(function(k){
    var code = k.slice(prefix.length).split('|')[0];
    var st = AGG.groups[k].metrics[field] || {};
    var recv = AGG.groups[k].metrics.recv || {};
    var ms = TREND_MONTHS.map(function(m){ return (AGG.groups[prefix + code + '|' + m] || {metrics:{}}).metrics[field] || {}; });
    return { code: code, v: st[state.stat], n: st.n, med: st.median, mn: st.mean, wv: st.wavg,
             clients: AGG.groups[k].clients, recv: recv.sum || 0, ms: ms };
  }).filter(function(r){ return r.n > 0; });
  // 注意：按 stat 排序必须读 r.v（值已归一存在 v 字段），不能读 r[state.stat] —— 后者恒为 undefined，
  // 会让比较器恒返回 0 而静默不排序。
  rows.sort(function(a, b){ return (b.v == null ? -1 : b.v) - (a.v == null ? -1 : a.v); });

  document.getElementById('chartTitle').textContent = fam.name + ' · ' + LAYER_CN[useLayer] + ' · 各' +
    (prefix === 'SITE:' ? '站点' : '平台') + '（' + STAT_CN[state.stat] + '，' + MLABEL['ALL'] + '）';
  drawBar(rows, fam.kind);

  var h = '<thead><tr><th>' + (prefix === 'SITE:' ? '站点' : '平台') + '</th><th>客户数</th><th>有效n</th><th>' + RANGE_CN + '接待量</th>' +
    TREND_MONTHS.map(function(m){ return '<th>' + MLABEL[m] + '</th>'; }).join('') +
    '<th>合计·均值</th><th>合计·中位</th><th>合计·加权</th></tr></thead><tbody>';
  for (var i = 0; i < rows.length; i++){
    var r = rows[i];
    h += '<tr' + (r.n < 5 ? ' class="warn"' : '') + '><td class="rh">' + r.code + '</td><td>' + r.clients + '</td><td>' + r.n + '</td>' +
      '<td>' + Math.round(r.recv).toLocaleString('en-US') + '</td>' +
      r.ms.map(function(x){ return '<td>' + fmt(x.mean, fam.kind) + '</td>'; }).join('') +
      '<td>' + fmt(r.mn, fam.kind) + '</td><td class="hl">' + fmt(r.med, fam.kind) + '</td><td class="hl">' + fmt(r.wv, fam.kind) + '</td></tr>';
  }
  h += '</tbody>';
  document.getElementById('tbl').innerHTML = h;
  document.getElementById('tblTitle').textContent = (prefix === 'SITE:' ? '站点' : '平台') + '明细（' + fam.name + ' · ' + LAYER_CN[useLayer] + '）';
  document.getElementById('layerWrap').style.opacity = fam.ids[state.layer] ? 1 : .45;
}

/* ---------- 图表绘制 ---------- */
function baseOpts(kind){
  var tick = {};
  if (kind === 'pct') tick = { callback: function(v){ return (v*100).toFixed(0) + '%'; } };
  else if (kind === 'int' || kind === 'money') tick = { callback: function(v){ return v >= 10000 ? (v/10000).toFixed(0) + '万' : v; } };
  else if (kind === 'dur') tick = { callback: function(v){ return Math.round(v/60) + '分'; } };
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: { position: 'top', labels: { font: { size: 12 }, usePointStyle: true, boxWidth: 8 } },
      tooltip: { callbacks: { label: function(c){ return c.dataset.label + ': ' + fmt(c.parsed.y != null ? c.parsed.y : c.parsed.x, kind); } } }
    },
    scales: {
      x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#4b5563' } },
      y: { beginAtZero: true, grid: { color: '#eef1f6' }, ticks: Object.assign({ font: { size: 11 }, color: '#6b7280' }, tick) }
    }
  };
}
function drawLine(prefix, labels, ds, kind, layers){
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), { type: 'line', data: { labels: labels, datasets: ds }, options: baseOpts(kind) });
}
function drawBar(rows, kind){
  if (chart) chart.destroy();
  var o = baseOpts(kind);
  o.indexAxis = 'y';
  o.plugins.legend = { display: false };
  o.plugins.tooltip = { callbacks: { label: function(c){
    var r = rows[c.dataIndex];
    return fmt(r.v, kind) + '  ·  有效n=' + r.n + '  ·  接待量 ' + Math.round(r.recv).toLocaleString('en-US');
  } } };
  o.scales = {
    x: { beginAtZero: true, grid: { color: '#eef1f6' }, ticks: Object.assign({ font: { size: 11 }, color: '#6b7280' }, (baseOpts(kind).scales.y.ticks)) },
    y: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#4b5563' } }
  };
  var h = Math.max(260, rows.length * 26 + 60);
  document.getElementById('chartWrap').style.height = h + 'px';
  chart = new Chart(document.getElementById('chart'), {
    type: 'bar',
    data: { labels: rows.map(function(r){ return r.code + (r.n < 5 ? ' (n=' + r.n + ')' : ''); }),
            datasets: [{ data: rows.map(function(r){ return r.v; }), backgroundColor: '#2F5597', borderRadius: 3, barThickness: 'flex', maxBarThickness: 20 }] },
    options: o
  });
}

/* ---------- 渲染入口 ---------- */
function render(){
  renderKpis();
  if (state.tab === 'industry'){ document.getElementById('chartWrap').style.height = '360px'; renderIndustry(); }
  else if (state.tab === 'site'){ renderDim('SITE:'); }
  else { renderDim('PLAT:'); }
  var fam = getFam();
  document.getElementById('layerWrap').style.display = (state.tab === 'industry') ? 'none' : '';
  document.getElementById('metricHint').textContent = fam.name + ' · ' + STAT_CN[state.stat];
}

// 事件绑定
var sel = document.getElementById('metric');
sel.innerHTML = FAMILIES.map(function(f){ return '<option value="' + f.id + '"' + (f.id === state.family ? ' selected' : '') + '>' + f.name + '</option>'; }).join('');
sel.addEventListener('change', function(){ state.family = sel.value; render(); });
document.getElementById('layer').addEventListener('change', function(e){ state.layer = e.target.value; render(); });
document.getElementById('stat').addEventListener('change', function(e){ state.stat = e.target.value; render(); });
var tabs = document.getElementById('tabs').querySelectorAll('button');
for (var i = 0; i < tabs.length; i++){
  tabs[i].addEventListener('click', function(){
    for (var k = 0; k < tabs.length; k++) tabs[k].classList.remove('on');
    this.classList.add('on');
    state.tab = this.dataset.tab;
    render();
  });
}
render();
</script>
